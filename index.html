<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE5; --ink:#17140F; --muted:#7A7166; --card:#FFFDF9; --line:rgba(23,20,15,.10);
  --coral:#8E2C3A; --cream:#F4EEE2; --cgold:#C9A55C; --lime:#D4F53C; --wine:#8E2C3A; --lilac:#C7B8FF; --sky:#9FD8F0; --gold:#FFC53D;
  --r:22px; --inv:#fff; --track:#DDD8CF; --rfill:#12372A; --soft:rgba(201,165,92,.10); --softb:#C9A55C; --msg:#E7F8DC;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:var(--st)}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0}

[data-theme=dark]{--bg:#12372A;--ink:#F4EEE2;--muted:#A3B5A9;--card:#1A4434;--line:rgba(244,238,226,.13);--inv:#12372A;--track:rgba(244,238,226,.28);--rfill:#F4EEE2;--soft:rgba(201,165,92,.10);--softb:#C9A55C;--msg:#1F5A3F;color-scheme:dark}
html,body,.app,.tabs,.sheet{transition:background-color .3s,color .3s}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 6px}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{flex:0 0 auto;border-radius:8px}
.lw{display:flex;flex-direction:column;line-height:1}
.ln{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:17px;letter-spacing:.13em;white-space:nowrap;text-transform:uppercase}
[data-theme=dark] .lc{color:#C9A55C}
[data-theme=dark] .seg{background:rgba(0,0,0,.22);border:1px solid rgba(244,238,226,.14)}
[data-theme=dark] .seg button{color:rgba(244,238,226,.7)}
[data-theme=dark] .seg button.on{background:#F4EEE2;color:#12372A;box-shadow:0 2px 8px rgba(0,0,0,.25)}
[data-theme=dark] .chip{border-color:rgba(244,238,226,.22)}
.lc{font-size:7.5px;font-weight:700;letter-spacing:.3em;white-space:nowrap;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hr{display:flex;align-items:center;gap:8px;min-width:0}
.themebtn{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.themebtn svg{width:17px;height:17px}

/* splash */
.splash{position:absolute;inset:0;z-index:100;background:#12372A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#F4EEE2;transition:opacity .5s ease,visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash .sicon{width:116px;height:116px;overflow:visible}
.splash .sicon .lc1,.splash .sicon .lc2,.splash .sicon .lpin,.splash .sicon .ldot,.splash .sicon .lspark{transform-box:fill-box;transform-origin:center}
.splash .lc1{animation:fanL .6s .1s cubic-bezier(.3,1.4,.5,1) both}
.splash .lc2{animation:fanR .6s .22s cubic-bezier(.3,1.4,.5,1) both}
.splash .lpin{animation:pinDrop .7s .45s cubic-bezier(.3,1.5,.5,1) both}
.splash .ldot{animation:dotPop .35s .95s cubic-bezier(.3,1.8,.5,1) both}
.splash .lspark{animation:spark 1.4s 1.05s ease-in-out both infinite}
@keyframes fanL{from{transform:rotate(14deg) scale(.4);opacity:0}to{transform:none}}
@keyframes fanR{from{transform:rotate(-11deg) scale(.4);opacity:0}to{transform:none}}
@keyframes pinDrop{from{transform:translateY(-90px) scale(.8);opacity:0}60%{opacity:1}to{transform:none}}
@keyframes dotPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spark{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.8) rotate(90deg);opacity:.9}}
.sw{display:flex;flex-direction:column;align-items:center;gap:10px}
.sn{display:flex;overflow:hidden;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:40px;letter-spacing:.2em;padding-left:.2em;line-height:1.1}
.sn span{display:inline-block;animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.sc{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:#C9A55C;padding-left:.5em}
.sc i{display:block;height:1px;width:46px;background:#C9A55C;transform-origin:center;animation:line .6s 1.5s cubic-bezier(.2,.9,.3,1) both}
.sc span{animation:fadeUp .5s 1.55s both}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.se{font-size:9px;font-weight:700;letter-spacing:.4em;text-transform:uppercase;color:rgba(244,238,226,.5);animation:fadeUp .5s 1.75s both;padding-left:.4em}
.tagline{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:19px;color:rgba(244,238,226,.75);animation:fadeUp .5s 2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.loc{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-weight:600;font-size:13px;min-width:0;max-width:150px}
.loc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* views */
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:58px;padding:9px 0 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.day small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day strong{font-family:"Bricolage Grotesque";font-size:20px;font-weight:700;line-height:1.1}
.day em{font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
.day.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.day.on small,.day.on em{color:var(--inv);opacity:.7}
.day .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral)}

/* filters */
.filters{padding:8px 18px 2px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:rgba(127,127,127,.13);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:13px;background:transparent;white-space:nowrap}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.hint{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 2px}

/* deck */
.deckwrap{flex:1;position:relative;margin:8px 18px 0;min-height:0}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;color:#fff;display:flex;flex-direction:column;container-type:size;touch-action:none;user-select:none;will-change:transform;box-shadow:0 18px 40px -18px rgba(23,20,15,.45);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.card .art{position:absolute;inset:0;z-index:0}
.card .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.3px);background-size:16px 16px;mask-image:linear-gradient(#000,transparent 70%)}
.card .emo{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;font-size:min(120px,26vw,24cqh);line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));overflow:hidden}
.card .shade{position:absolute;inset:auto 0 0 0;height:66%;background:linear-gradient(transparent,rgba(12,10,8,.82));z-index:0}
.card .txt{position:relative;z-index:2;flex:0 0 auto;padding:6px 20px 20px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;max-height:26px;overflow:hidden;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;line-height:16px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h2{font-size:clamp(22px,7vw,28px);font-weight:800;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .place{font-weight:600;font-size:14px;opacity:.85;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:8px 0 0;font-size:14px;line-height:1.4;opacity:.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .topbadges{order:-1;position:relative;z-index:2;flex:0 0 auto;padding:14px 14px 0;display:flex;justify-content:space-between;gap:8px}
.card .topbadges .tag{min-width:0;overflow:hidden;text-overflow:ellipsis}
.card .topbadges .tag:last-child{flex-shrink:0}
.stamp{z-index:3}
@container (max-height:430px){.card p{-webkit-line-clamp:2}}
@container (max-height:340px){.card p{display:none}}
@container (max-height:250px){.card .tags{display:none}.card h2{-webkit-line-clamp:1}}
.stamp{position:absolute;top:40px;font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;padding:2px 12px;border:4px solid;border-radius:12px;opacity:0;letter-spacing:.02em}
.stamp.yes{left:22px;color:#fff;background:var(--wine);border-color:#fff;transform:rotate(-14deg)}
.stamp.no{right:22px;color:#fff;border-color:#fff;transform:rotate(14deg)}
.stamp.sup{left:50%;top:auto;bottom:46%;transform:translateX(-50%) rotate(-4deg);color:var(--gold);border-color:var(--gold)}
.card.back1{transform:scale(.95) translateY(12px)}
.card.back2{transform:scale(.90) translateY(24px)}
.empty{position:absolute;inset:0;border-radius:28px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.empty .big{font-size:52px}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.btn{padding:13px 18px;border-radius:999px;background:var(--ink);color:var(--inv);font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.loading{position:absolute;inset:0;border-radius:28px;background:linear-gradient(110deg,var(--card) 30%,var(--bg) 50%,var(--card) 70%);background-size:250% 100%;animation:sh 1.3s infinite linear;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:700;text-align:center;padding:24px}
@keyframes sh{to{background-position:-150% 0}}

.actions{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 12px}
.act{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 6px 18px -8px rgba(23,20,15,.35);border:1px solid var(--line);transition:transform .15s}
.act:active{transform:scale(.9)}
.act.s{width:44px;height:44px}
.act svg{width:26px;height:26px}
.act.s svg{width:20px;height:20px}

/* tabbar */
.tabs{display:flex;justify-content:space-around;padding:8px 18px calc(10px + var(--sb));background:var(--bg);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 14px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:3px;background:var(--coral)}
.tab .badge{position:absolute;top:0;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;display:grid;place-items:center}

/* map */
.maphead{padding:6px 18px 8px;display:flex;flex-direction:column;gap:8px}
.maphead h2{font-size:28px;font-weight:800}
.maphead .sub{color:var(--muted);font-size:13px;font-weight:600}
.mapbox{flex:1;position:relative;margin:0 12px 10px;border-radius:28px;overflow:hidden;background:var(--card);touch-action:none;border:1px solid var(--line)}
.mapbox svg{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 12px -6px rgba(23,20,15,.3);font-weight:700;font-size:20px;color:var(--ink)}
.mapnote{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--card) 90%,transparent);padding:7px 10px;border-radius:12px;width:max-content;max-width:calc(100% - 24px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.mapnote span{display:inline-flex;align-items:center;gap:4px}.mapnote i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pulse{animation:pu 2s infinite}
.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.radbig{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;background:var(--ink);color:var(--inv);padding:5px 12px;border-radius:12px;white-space:nowrap}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--rfill) var(--p,66%),var(--track) var(--p,66%));outline:none;margin:10px 0 4px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--wine);border:3px solid var(--cream);box-shadow:0 2px 8px rgba(23,20,15,.22);cursor:pointer}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--wine);border:3px solid var(--cream);box-shadow:0 2px 8px rgba(23,20,15,.22);cursor:pointer}
@keyframes pu{0%{opacity:.6;r:3}100%{opacity:0;r:12}}

/* plan */
.plan{flex:1;overflow-y:auto;padding:4px 18px 20px}
.planhead{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 0 12px}
.planhead h2{font-size:28px;font-weight:800}
.pday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.pday .h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pday .date{width:50px;height:54px;border-radius:16px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto}
.pday .date small{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.7}
.pday .date b{font-family:"Bricolage Grotesque";font-size:21px;line-height:1}
.pday .meta{flex:1;min-width:0}
.pday .meta h3{font-size:17px}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(23,20,15,.06)}
.pill.in{background:var(--cream);color:#12372A} .pill.out{background:var(--wine);color:#fff}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--muted);font-weight:600}
.item.pick{background:linear-gradient(90deg,rgba(142,44,58,.25),transparent);margin:0 -14px;padding:10px 14px;border-radius:0}
.ibtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);font-size:15px;flex:0 0 auto}
.ibtn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.planempty{text-align:center;padding:60px 20px;color:var(--muted)}
.planempty .big{font-size:56px}
.planempty h3{color:var(--ink);font-size:22px;margin:10px 0 6px}

/* weather icons */
.wi{width:28px;height:28px;display:block;overflow:visible}
.wi .spin{animation:wspin 10s linear infinite}
.wi .drift{animation:wdrift 3s ease-in-out infinite alternate}
.wi .drop{animation:wdrop 1s linear infinite}
.wi .flake{animation:wflake 2.1s linear infinite}
.wi .bolt{animation:wflash 2.4s infinite}
.wi .fogl{animation:wfog 3s ease-in-out infinite alternate}
@keyframes wspin{to{transform:rotate(360deg)}}
@keyframes wdrift{from{transform:translateX(-1.3px)}to{transform:translateX(1.5px)}}
@keyframes wdrop{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes wflake{0%{transform:translate(0,-2px);opacity:0}25%{opacity:1}100%{transform:translate(1.5px,6px);opacity:0}}
@keyframes wflash{0%,78%,100%{opacity:1}82%,90%{opacity:.15}}
@keyframes wfog{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.wi *{animation:none!important}}
.day{width:62px;gap:2px;padding:8px 0 7px}
.day .temp{color:var(--ink);font-size:13px;font-weight:800}
.day.on .temp{color:var(--inv)}
.day.on .wi path,.day.on .wi circle{stroke:#17140F}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
.calhead h2{font-size:28px;font-weight:800}
.seg.mini{width:160px}.seg.mini button{padding:6px 0;font-size:12px}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nb{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800}
.calnav .mid{flex:1;text-align:center}.calnav .mid b{font-family:"Bricolage Grotesque";font-size:18px;display:block}.calnav .mid span{font-size:12px;color:var(--muted);font-weight:600}
.crow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.crow.past{opacity:.45}
.cdate{width:48px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}
.cdate small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.cdate b{font-family:"Bricolage Grotesque";font-size:22px;line-height:1.15;min-width:34px;text-align:center;border-radius:12px}
.crow.today .cdate b{background:var(--coral);color:#fff}
.cw{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800}.cw .wi{width:24px;height:24px}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ev{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 10px 10px 9px;width:100%}
.evt{font-weight:800;font-size:13px;min-width:42px;font-variant-numeric:tabular-nums}
.evm{flex:1;min-width:0}.evm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evm span{display:block;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;max-width:52px}
.who span{max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:0 0 auto;border:1.5px solid var(--ink)}
.ideas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.il{font-size:14px}
.idea{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:1.5px dashed rgba(23,20,15,.35);text-align:left}
.idea b{color:var(--coral)}
.addev{align-self:flex-start;font-size:12px;font-weight:700;color:var(--muted);padding:4px 2px}
.calnote{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 0}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mwd{font-size:11px;color:var(--muted);text-align:center;font-weight:800;padding-bottom:2px}
.mc{aspect-ratio:.82;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:15px}
.mc em{font-style:normal;font-size:10px;color:var(--muted);font-weight:700}
.mc.out{opacity:.35}.mc.today{background:var(--ink);color:var(--inv)}.mc.today em{color:var(--inv);opacity:.7}
.dots{display:flex;gap:2px;height:6px}.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
i.e{background:var(--coral)}i.i{background:var(--cgold)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);margin-top:12px}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:16px;outline:none;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:46px}
.inp:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip.p{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px}

.sortbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--soft);border:1.5px dashed var(--softb);border-radius:14px;padding:9px 10px}
.stack{display:flex;flex:0 0 auto}.stack i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;border:2px solid var(--soft);margin-left:-8px}.stack i:first-child{margin-left:0}
.st{flex:1;min-width:0}.st b{display:block;font-size:13px}.st small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.chev{font-size:22px;font-weight:700;color:var(--cgold)}
.dayacts{display:flex;gap:12px}.addev.share{color:#1FA855}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;transition:transform .22s,opacity .22s}
.srow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.srow .tx{flex:1;min-width:0}.srow .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow .tx span{font-size:12px;color:var(--muted);font-weight:600}
.srow.kept{transform:translateX(40px);opacity:0;background:#F1FBD0}.srow.gone{transform:translateX(-40px);opacity:0}
.sbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;flex:0 0 auto;border:1px solid var(--line);background:var(--card)}
.sbtn.yes{background:var(--wine);color:#fff;border-color:var(--wine)}
.msgprev{background:var(--msg);border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:13px;line-height:1.5;margin:6px 0 14px;max-height:260px;overflow-y:auto;word-break:break-word}
.btn.wa{background:#25D366;display:flex!important;align-items:center;justify-content:center;gap:8px;width:100%}

/* gate */
.gate{position:absolute;inset:0;z-index:90;background:#12372A;color:#F4EEE2;overflow-y:auto;padding:calc(40px + var(--st)) 26px calc(30px + var(--sb));display:flex;flex-direction:column}
.gate[hidden]{display:none}
.gate .gi{width:64px;height:64px;margin:0 auto 18px}
.gate h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.gate .sub{text-align:center;font-size:10px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;color:#C9A55C;margin:6px 0 22px}
.gate p{color:rgba(244,238,226,.75);line-height:1.55;font-size:14px;text-align:center;margin:0 0 18px}
.gate label{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,238,226,.6);margin:14px 0 6px;display:block}
.gate input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(244,238,226,.2);background:rgba(244,238,226,.07);color:#F4EEE2;font:inherit;font-size:16px;outline:none}
.gate input:focus{border-color:#C9A55C}
.gate input.code{text-align:center;font-size:24px;letter-spacing:.35em;font-weight:800;text-transform:uppercase}
.gbtn{display:block;width:100%;text-align:center;text-decoration:none;padding:15px;border-radius:14px;background:#C9A55C;color:#12372A;font-weight:800;font-size:15px;margin-top:18px}
.gbtn.ghost{background:transparent;color:#F4EEE2;border:1px solid rgba(244,238,226,.25);margin-top:10px}
.glink{background:none;border:0;color:rgba(244,238,226,.55);font-weight:700;font-size:12px;margin:14px auto 0;display:block;text-decoration:underline}
.gbox{background:rgba(244,238,226,.06);border:1px solid rgba(244,238,226,.14);border-radius:16px;padding:14px;font-size:13px;line-height:1.5;margin-top:6px}
.gbox b{color:#C9A55C}
.gerr{color:#FF8A7A;font-size:13px;font-weight:700;text-align:center;margin-top:10px;min-height:18px}
.gfoot{margin-top:auto;padding-top:26px}
.gsmall{font-size:12px!important;opacity:.7;margin-top:14px!important}
.glink.demo{border:1px dashed rgba(201,165,92,.5);border-radius:10px;padding:8px 12px;text-decoration:none;color:#C9A55C}
.gbtn:disabled{opacity:.7}
.wait{position:relative;width:110px;height:110px;margin:10px auto 22px;display:grid;place-items:center}
.wait .gi.big{width:72px;height:72px;margin:0;animation:bob 2.4s ease-in-out infinite;position:relative;z-index:1}
.wait .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid #C9A55C;opacity:0;animation:ripple 2.4s ease-out infinite}
.wait .ring.r2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ripple{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.steps{display:flex;flex-direction:column;gap:0;margin:6px 0 0;padding:4px 0}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:1.5px;background:rgba(244,238,226,.18)}
.step i{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;border:1.5px solid rgba(244,238,226,.25);color:rgba(244,238,226,.5)}
.step.done i{background:#C9A55C;border-color:#C9A55C;color:#12372A}
.step.now i{border-color:#C9A55C}
.step.now i em{width:10px;height:10px;border-radius:50%;background:#C9A55C;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
.step b{display:block;font-size:14px}.step span{display:block;font-size:12px;color:rgba(244,238,226,.6);margin-top:2px}
.step:not(.done):not(.now) b{color:rgba(244,238,226,.5)}
.yay{display:grid;place-items:center;margin:30px auto 24px}
.yay .badge{width:96px;height:96px;border-radius:50%;background:#C9A55C;color:#12372A;display:grid;place-items:center;font-size:44px;font-weight:800;animation:pop2 .6s cubic-bezier(.3,1.7,.5,1) both;box-shadow:0 0 0 10px rgba(201,165,92,.15),0 0 0 22px rgba(201,165,92,.07)}
@keyframes pop2{from{transform:scale(0) rotate(-30deg)}to{transform:none}}

.pvbtn{display:block;margin:22px auto 8px;padding:9px 14px;border-radius:12px;border:1px dashed var(--muted);color:var(--muted);font-size:12px;font-weight:700}
.gl{position:absolute;inset:0}
.glon #map{display:none}
.glyou{width:16px;height:16px;border-radius:50%;background:#2F7BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.22),0 1px 4px rgba(0,0,0,.3)}
.glrad{font:800 11px Manrope,sans-serif;background:#17331F;color:#fff;padding:3px 9px;border-radius:999px}
[data-theme=dark] .glrad{background:#C9A55C;color:#12372A}
.glpin{cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.maplibregl-ctrl-attrib{font-size:10px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(23,20,15,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + var(--sb));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.3,1);z-index:21;max-height:85%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(23,20,15,.22);margin:0 auto 14px;position:relative}.sheet .grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sheet.drag{transition:none}
.sheet h3{font-size:24px;font-weight:800}
.sheet p{color:var(--muted);line-height:1.5;font-size:14px}
.field{display:flex;gap:8px;margin:12px 0}
.field input{flex:1;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:16px;outline:none}
.field input:focus{border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hero{height:150px;border-radius:22px;display:grid;place-items:center;font-size:72px;margin-bottom:14px}
.kv{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.kv span{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
a.btn{text-decoration:none;display:inline-block}

/* match + toast */
.match{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 38%,#A43546,#8E2C3A 40%,#12372A 100%);color:#fff;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .25s}
.match.on{opacity:1;pointer-events:auto}
.match h2{font-size:52px;font-weight:800;line-height:.95;transform:rotate(-4deg)}
.match .e{font-size:90px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.match p{font-weight:600;opacity:.92;margin:0}
.match .btn{background:#F4EEE2;color:#12372A}.match .btn.ghost{background:transparent;color:#F4EEE2;border-color:#F4EEE2}
.toast{position:absolute;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,20px);background:var(--ink);color:var(--inv);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:40;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

const WMO = c=>c==null?"":c<=1?"☀️":c<=3?"⛅":c<=48?"🌫️":c<=67?"🌧️":c<=77?"❄️":c<=82?"🌦️":c<=86?"🌨️":"⛈️";
async function loadWeather(){
  const key=S.center.lat.toFixed(2)+","+S.center.lng.toFixed(2)+"|"+todayISO();
  if(S.weather&&S.weather.key===key&&!S.weather.demo){renderDays();renderHint();return}
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.center.lat}&longitude=${S.center.lng}&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=14`);
    const j=await r.json();const days={};
    j.daily.time.forEach((t,i)=>days[t]={c:j.daily.weather_code[i],t:Math.round(j.daily.temperature_2m_max[i]),p:j.daily.precipitation_probability_max[i]});
    S.weather={key,days};save();
  }catch(e){
    // Vorschau: Live-Wetter gesperrt -> Demo-Wetter, damit man die Animationen sieht
    const days={};const t=new Date();const codes=[0,1,2,3,61,63,80,45,71,2,0,95,3,2];
    for(let i=0;i<14;i++){const k=iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));const x=hash(k+S.center.name);const c=codes[x%codes.length];
      days[k]={c,t:c>=71&&c<=86?0+x%3:2+x%8,p:c>=51?60+x%35:5+x%25}}
    S.weather={key,days,demo:true};
  }
  renderDays();renderHint();if($("#v-plan").classList.contains("on"))renderPlan();
}
const wsvg=i=>`<svg class="wi" viewBox="0 0 32 32" aria-hidden="true">${i}</svg>`;
function wIcon(c){
  if(c==null)return"";
  const sun=(cx=16,cy=16,r=5.5)=>`<g class="spin" style="transform-origin:${cx}px ${cy}px">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${cx}" y1="${cy-r-2.4}" x2="${cx}" y2="${cy-r-4.8}" stroke="#FFB800" stroke-width="2" stroke-linecap="round" transform="rotate(${a} ${cx} ${cy})"/>`).join("")}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFC53D" stroke="#17140F" stroke-width="1.2"/>`;
  const cloud=(dy=0,f="#E9EDF5")=>`<g class="drift"><path transform="translate(0 ${dy})" d="M9 24h14a5 5 0 0 0 .6-9.96A7 7 0 0 0 10.2 13 5.5 5.5 0 0 0 9 24z" fill="${f}" stroke="#17140F" stroke-width="1.2" stroke-linejoin="round"/></g>`;
  const drops=[11,16,21].map((x,i)=>`<line class="drop" style="animation-delay:${i*.33}s" x1="${x}" y1="22" x2="${x-1}" y2="25" stroke="#3D9BFF" stroke-width="2" stroke-linecap="round"/>`).join("");
  const flakes=[11,16,21].map((x,i)=>`<circle class="flake" style="animation-delay:${i*.7}s" cx="${x}" cy="23" r="1.4" fill="#fff" stroke="#3D9BFF" stroke-width=".8"/>`).join("");
  if(c<=1)return wsvg(sun());
  if(c===2)return wsvg(sun(11.5,11,4.6)+cloud(2.5));
  if(c===3)return wsvg(cloud(-1));
  if(c<=48)return wsvg(cloud(-4,"#D9DEE8")+`<g class="fogl"><line x1="7" y1="24" x2="22" y2="24" stroke="#9AA3B5" stroke-width="2" stroke-linecap="round"/><line x1="11" y1="28" x2="26" y2="28" stroke="#9AA3B5" stroke-width="2" stroke-linecap="round"/></g>`);
  if((c>=71&&c<=77)||c===85||c===86)return wsvg(cloud(-4)+flakes);
  if(c>=95)return wsvg(cloud(-4,"#C4CAD8")+`<path class="bolt" d="M16.5 19 L13 25 H16 L14.5 30 L20 23 H17 L18.5 19Z" fill="#FFC53D" stroke="#17140F" stroke-width=".8" stroke-linejoin="round"/>`);
  return wsvg(cloud(-4,"#D9DEE8")+drops);
}

function renderDays(){
  const el=$("#days");let h="";const t=new Date();
  for(let i=0;i<14;i++){
    const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);const k=iso(d);const w=wx(k);
    const has=Object.values(S.decisions[k]||{}).some(v=>v!=="nope")||S.events.some(e=>e.date===k);
    h+=`<button class="day ${k===S.day?"on":""}" data-d="${k}">${has?'<span class="dot"></span>':""}<small>${i===0?"Heute":i===1?"Morgen":WD[d.getDay()]}</small><strong>${d.getDate()}</strong>${w?wIcon(w.c)+`<em class="temp">${w.t}°</em>`:`<em>${d.getMonth()+1}.</em>`}</button>`;
  }
  el.innerHTML=h;
  el.querySelectorAll(".day").forEach(b=>b.onclick=()=>{S.day=b.dataset.d;save();renderDays();renderHint();renderDeck()});
  const on=el.querySelector(".on");if(on)el.scrollLeft=on.offsetLeft-el.clientWidth/2+on.clientWidth/2;

function renderHint(){

  if(w){t+=` · ${WMO(w.c)} ${w.t}°`; if(w.p>=60) t+=` · ${w.p}% Regen – drinnen wär schlau`; else if(w.p<=20&&w.c<=3) t+=" · perfekt für draußen";if(S.weather.demo)t+=" · Demo-Wetter";}

/* ---------- Deck ---------- */
let loadingIdeas=false;
function deckList(){
  const dec=S.decisions[S.day]||{};const m=parseD(S.day).getMonth()+1;
  const w=wx(S.day);const rainy=w&&w.p>=60;
  return [...ACTS.values()].filter(a=>{
    if(dec[a.id])return false;
    if(dist(S.center,a)>S.radius)return false;
    if(S.setting!=="any"&&a.setting!==S.setting)return false;
    if(S.vibes.length&&!a.vibes.some(v=>S.vibes.includes(v)))return false;
    if(a.months&&!a.months.includes(m))return false;
    return true;
  }).sort((a,b)=>{
    if(rainy&&S.setting==="any"&&a.setting!==b.setting)return a.setting==="in"?-1:1;
    return hash(a.id+S.day)-hash(b.id+S.day);
  });
}

function topCard(){const c=$("#deck").querySelectorAll(".card");return c[c.length-1]}
function bindTop(){
  const c=topCard();if(!c)return;
  let sx=0,sy=0,dx=0,dy=0,down=false,t0=0;
  const yes=c.querySelector(".yes"),no=c.querySelector(".no"),sup=c.querySelector(".sup");
  c.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();c.style.transition="none";c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/16}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/90));no.style.opacity=Math.max(0,Math.min(1,-dx/90));
    sup.style.opacity=Math.abs(dx)<60?Math.max(0,Math.min(1,-dy/110)):0};
  c.onpointerup=c.onpointercancel=()=>{if(!down)return;down=false;c.style.transition="";
    const v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(dx>110||(dx>40&&v>.6))fly(c,"like");
    else if(dx<-110||(dx<-40&&v>.6))fly(c,"nope");
    else if(dy<-130&&Math.abs(dx)<80)fly(c,"super");
    else{c.style.transform="";yes.style.opacity=no.style.opacity=sup.style.opacity=0;
      if(Math.abs(dx)<6&&Math.abs(dy)<6)showDetail(c.dataset.id)}};
}
function fly(c,verdict){

  const x=verdict==="like"?innerWidth*1.3:verdict==="nope"?-innerWidth*1.3:0;
  const y=verdict==="super"?-innerHeight:60;
  c.style.transform=`translate(${x}px,${y}px) rotate(${x/30}deg)`;c.style.opacity=0;
  c.querySelector(verdict==="like"?".yes":verdict==="nope"?".no":".sup").style.opacity=1;

   <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.3.3c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg> Per WhatsApp schicken</a>
   <button class="btn ghost" id="cpTxt" style="width:100%;margin-top:8px">📋 Text kopieren</button>`);
  $("#cpTxt").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("📋 Kopiert")}catch(e){toast("Kopieren nicht möglich")}};
}
function sortSheet(d){
  const x=parseD(d);
  const draw=()=>{
    const ideas=ideasFor(d);
    if(!ideas.length){closeSheet();renderPlan();renderDays();badge();toast("✓ Fertig aussortiert");return}
    const kept=eventsFor(d).filter(e=>e.actId).length;
    openSheet(`<h3>Aussortieren</h3><p>${WDL[x.getDay()]}, ${x.getDate()}.${x.getMonth()+1}. · noch ${ideas.length} ${ideas.length===1?"Idee":"Ideen"}${kept?` · ${kept} schon ausgewählt`:""}</p>
     <div class="slist">${ideas.map(({a,v})=>{const km=dist(S.center,a);return `<div class="srow" data-row="${esc(a.id)}"><div class="ic" style="background:${grad(a)}">${esc(a.emoji)}</div>
       <div class="tx"><b>${v==="super"?"⭐ ":""}${esc(a.title)}</b><span>${esc(a.place)} · ${Math.round(km)} km · ${esc(a.duration)}</span></div>
       <button class="sbtn no" data-x="${esc(a.id)}" aria-label="Raus">✕</button><button class="sbtn yes" data-k="${esc(a.id)}" aria-label="Machen wir">✓</button></div>`}).join("")}</div>
     <div class="row" style="margin-top:14px"><button class="btn" id="sDone" style="flex:1">Fertig</button><button class="btn ghost" id="sDrop">Rest raus</button></div>`);
    const out=(id,cls,fn)=>{const r=document.querySelector(`#sheet [data-row="${CSS.escape(id)}"]`);r&&r.classList.add(cls);setTimeout(()=>{fn();save();draw()},220)};
    document.querySelectorAll("#sheet [data-k]").forEach(b=>b.onclick=()=>{const id=b.dataset.k,a=ACTS.get(id);
      out(id,"kept",()=>S.events.push({id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:d,time:"",actId:id,title:a.title,emoji:a.emoji,person:"",note:""}))});
    document.querySelectorAll("#sheet [data-x]").forEach(b=>b.onclick=()=>out(b.dataset.x,"gone",()=>{(S.decisions[d]=S.decisions[d]||{})[b.dataset.x]="nope"}));
    $("#sDone").onclick=()=>{closeSheet();renderPlan();renderDays();badge()};
    $("#sDrop").onclick=()=>{ideasFor(d).forEach(({a})=>S.decisions[d][a.id]="nope");save();closeSheet();renderPlan();renderDays();badge();toast("Rest aussortiert")};
  };
  draw();
}
function editEvent(o){
  let ev=o.id?S.events.find(e=>e.id===o.id):null;const isNew=!ev;
  if(!ev){const a=o.actId&&ACTS.get(o.actId);ev={id:"e"+Date.now().toString(36),date:o.date||S.day,time:"",actId:o.actId||null,title:a?a.title:"",emoji:a?a.emoji:"📌",person:"",note:""}}
  const a=ev.actId&&ACTS.get(ev.actId);
  const EMO=["📌","💕","🍽️","☕","🎬","🏃","🛍️","🎉","🧖","🏛️"];
  const people=[...new Set([...S.people,...S.events.map(e=>e.person).filter(Boolean)])].slice(0,12);
  openSheet(`${a?`<div class="hero" style="background:${grad(a)};height:110px;font-size:56px">${esc(a.emoji)}</div>`:""}
   <h3>${isNew?"Termin eintragen":"Termin bearbeiten"}</h3>
   ${a?"":`<div class="lbl">Symbol</div><div class="row" id="emoRow">${EMO.map(x=>`<button class="chip ${x===ev.emoji?"on":""}" data-emo="${x}">${x}</button>`).join("")}</div>`}
   <div class="lbl">Was?</div><input class="inp" id="evTitle" value="${esc(ev.title)}" placeholder="z. B. Abendessen, Kino, Flohmarkt">
   <div class="two"><div><div class="lbl">Tag</div><input class="inp" type="date" id="evDate" value="${ev.date}"></div>
   <div><div class="lbl">Uhrzeit</div><input class="inp" type="time" id="evTime" value="${esc(ev.time)}"></div></div>
   <div class="lbl">Mit wem?</div>
   ${people.length?`<div class="row" id="pplRow" style="margin-bottom:8px">${people.map(p=>`<button class="chip p ${p===ev.person?"on":""}" data-p="${esc(p)}">${avatar(p,20)} ${esc(p)}</button>`).join("")}</div>`:""}
   <input class="inp" id="evPerson" value="${esc(ev.person)}" placeholder="Name eintragen">
   <div class="lbl">Notiz</div><input class="inp" id="evNote" value="${esc(ev.note)}" placeholder="z. B. Tisch reserviert, Treffpunkt …">
   <div class="row" style="margin-top:18px"><button class="btn coral" id="evSave" style="flex:1">Speichern</button>${isNew?"":`<button class="btn ghost" id="evDel">Löschen</button>`}</div>
   ${a?`<div class="row" style="margin-top:10px"><a class="btn ghost" style="flex:1;text-align:center" href="https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}" target="_blank" rel="noopener">🧭 Route</a></div>`:""}`);
  let emo=ev.emoji;
  document.querySelectorAll("#emoRow [data-emo]").forEach(b=>b.onclick=()=>{emo=b.dataset.emo;document.querySelectorAll("#emoRow .chip").forEach(c=>c.classList.toggle("on",c===b))});
  document.querySelectorAll("#pplRow [data-p]").forEach(b=>b.onclick=()=>{const on=$("#evPerson").value===b.dataset.p;$("#evPerson").value=on?"":b.dataset.p;document.querySelectorAll("#pplRow .chip").forEach(c=>c.classList.toggle("on",!on&&c===b))});
  $("#evSave").onclick=()=>{
    const title=$("#evTitle").value.trim();if(!title){$("#evTitle").focus();toast("Gib dem Termin einen Namen");return}
    Object.assign(ev,{title,date:$("#evDate").value||ev.date,time:$("#evTime").value,person:$("#evPerson").value.trim(),note:$("#evNote").value.trim(),emoji:emo});
    if(isNew)S.events.push(ev);
    if(ev.person&&!S.people.includes(ev.person))S.people.unshift(ev.person);
    save();closeSheet();calWeek=weekStartOf(ev.date);renderPlan();renderDays();badge();toast(`🗓️ ${ev.title} eingetragen`);
  };
  const del=$("#evDel");del&&(del.onclick=()=>{S.events=S.events.filter(e=>e.id!==ev.id);save();closeSheet();renderPlan();renderDays();badge();toast("Termin gelöscht")});
}
function badge(){const t=todayISO();const n=S.events.filter(e=>e.date>=t).length+Object.keys(S.decisions).filter(d=>d>=t).reduce((s,d)=>s+ideasFor(d).length,0);const b=$("#planBadge");b.style.display=n?"grid":"none";b.textContent=n}

/* ---------- Details, Sheet, Match, Toast ---------- */
function showDetail(id){
  const a=ACTS.get(id);if(!a)return;const km=dist(S.center,a);
  const days=Object.entries(S.decisions).filter(([d,dec])=>d>=todayISO()&&dec[id]&&dec[id]!=="nope").map(([d])=>{const x=parseD(d);return `${WD[x.getDay()]} ${x.getDate()}.${x.getMonth()+1}.`});
  openSheet(`<div class="hero" style="background:${grad(a)}">${esc(a.emoji)}</div><h3>${esc(a.title)}</h3>
   <div class="kv"><span>📍 ${esc(a.place)}</span><span>🚗 ${Math.round(km)} km · ${drive(km)}</span><span>⏱️ ${esc(a.duration)}</span><span>💶 ${esc(a.price)}</span><span>${a.setting==="in"?"🏠 drinnen":"🌤️ draußen"}</span>${days.length?`<span>🗓️ ${days.join(", ")}</span>`:""}</div>
   <p style="color:var(--ink);font-size:15px">${esc(a.desc)}</p>
   <div class="row"><button class="btn coral" id="dPlan">🗓️ Einplanen</button><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}" target="_blank" rel="noopener">🧭 Route</a>
   <a class="btn ghost" href="https://www.google.com/search?q=${encodeURIComponent(a.title+" "+a.place)}" target="_blank" rel="noopener">Öffnungszeiten</a></div>
   <p style="font-size:12px;margin-top:14px">Tipp: Öffnungszeiten vorher kurz checken.</p>`);
  const dd=Object.entries(S.decisions).filter(([d,dec])=>d>=todayISO()&&dec[id]&&dec[id]!=="nope").map(([d])=>d).sort()[0]||S.day;
  $("#dPlan").onclick=()=>editEvent({date:dd,actId:id});
}
function openSheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#sheet").style.transform="";$("#sheet").scrollTop=0;$("#scrim").style.opacity="";$("#sheet").classList.add("on");$("#scrim").classList.add("on")}
function closeSheet(){const s=$("#sheet");s.classList.remove("on","drag");s.style.transform="";$("#scrim").classList.remove("on");$("#scrim").style.opacity=""}
// Sheet nach unten wegziehen zum Schließen
(function sheetDrag(){
  const s=$("#sheet"),sc=$("#scrim");let y0=null,dy=0,t0=0,active=false;
  const skip=t=>t.closest("input,textarea,select,.range,.slist button,.sbtn");
  const start=(y,t)=>{if(!s.classList.contains("on")||skip(t))return;
    if(s.scrollTop>0&&!t.closest(".grab"))return; y0=y;dy=0;t0=Date.now();active=false};
  const move=(y,e)=>{if(y0==null)return;const d=y-y0;
    if(!active){if(d>6&&s.scrollTop<=0){active=true;s.classList.add("drag")}else if(d<-6){y0=null;return}else return}
    dy=Math.max(0,d);s.style.transform=`translateY(${dy}px)`;sc.style.opacity=String(Math.max(0,1-dy/(s.offsetHeight*.9)));
    if(e&&e.cancelable)e.preventDefault()};
  const end=()=>{if(y0==null)return;const v=dy/Math.max(1,Date.now()-t0);y0=null;
    if(!active)return;active=false;s.classList.remove("drag");
    if(dy>110||(v>.5&&dy>45)){s.style.transform="";closeSheet()}else{s.style.transform="";sc.style.opacity=""}};
  s.addEventListener("touchstart",e=>start(e.touches[0].clientY,e.target),{passive:true});
  s.addEventListener("touchmove",e=>move(e.touches[0].clientY,e),{passive:false});
  s.addEventListener("touchend",end);s.addEventListener("touchcancel",end);
  // Maus (Computer)
  s.addEventListener("mousedown",e=>{start(e.clientY,e.target);const mm=ev=>move(ev.clientY,ev),mu=()=>{end();removeEventListener("mousemove",mm);removeEventListener("mouseup",mu)};addEventListener("mousemove",mm);addEventListener("mouseup",mu)});
})();
$("#scrim").onclick=closeSheet;
function showMatch(a){
  const m=$("#match");
  m.innerHTML=`<div class="e">${esc(a.emoji)}</div><h2>It's a<br>Match!</h2><p>${esc(a.title)} ist ein Must-do<br>für ${(()=>{const x=parseD(S.day);return WDL[x.getDay()]+", "+x.getDate()+"."+(x.getMonth()+1)+"."})()}</p>
   <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="mPlan">Zum Plan</button><button class="btn ghost" id="mGo" style="color:#fff;border-color:#fff">Weiter swipen</button></div>`;
  m.classList.add("on");
  $("#mPlan").onclick=()=>{m.classList.remove("on");calWeek=weekStartOf(S.day);calView="week";go("plan")};$("#mGo").onclick=()=>m.classList.remove("on");
}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)}

/* ---------- Navigation ---------- */
function go(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  if(v==="map"){loadGL();renderMap();if(GLON)setTimeout(()=>GL.resize(),30)}if(v==="plan")renderPlan();if(v==="discover")renderDeck();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
$("#locBtn").onclick=locSheet;
$("#bYes").onclick=()=>swipeBtn("like");$("#bNo").onclick=()=>swipeBtn("nope");$("#bSuper").onclick=()=>swipeBtn("super");
$("#bUndo").onclick=undo;$("#bInfo").onclick=()=>{const c=topCard();c&&showDetail(c.dataset.id)};

/* ---------- Hell / Dunkel ---------- */
const sysDark=matchMedia("(prefers-color-scheme: dark)");
const effTheme=()=>S.theme||"dark"; // Standard: Club-Grün
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19l7-7"/></svg>';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
function applyTheme(){const t=effTheme();document.documentElement.dataset.theme=t;$("#themeBtn").innerHTML=t==="dark"?SUN:MOON;
  $("#themeMeta").setAttribute("content",t==="dark"?"#12372A":"#F3EEE5");if(GLON)styleGL();if($("#v-map").classList.contains("on"))renderMap()}
$("#themeBtn").onclick=()=>{S.theme=effTheme()==="dark"?"light":"dark";save();applyTheme();toast(S.theme==="dark"?"🌲 Club-Grün":"☀️ Hell")};
applyTheme();

/* ---------- Zugang (Club-Mitgliedschaft) ---------- */
// DESIGN-VORSCHAU: Später schickt "Anfragen" die Anfrage an einen Server (Google Apps Script),
// der dir eine Mail mit "Zugriff gewähren / ablehnen" sendet. Hier wird die Antwort nur simuliert.
const GICON=(cls="gi")=>`<svg class="${cls}" viewBox="0 0 100 100">${document.querySelector(".logo svg").innerHTML}</svg>`;
function gateStatus(){const a=S.access||{};if(a.ok)return"ok";return a.status||"new"}
function deviceId(){let d=null;try{d=localStorage.getItem("nfc_dev")}catch(e){}
  if(!d){const a=new Uint8Array(16);crypto.getRandomValues(a);d=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("nfc_dev",d)}catch(e){}}return d}
async function api(params){const q=new URLSearchParams({...params,device:deviceId()});
  const r=await fetch(API_URL+"?"+q.toString(),{redirect:"follow"});return r.json()}
let gatePoll=null;
async function checkStatus(){if(!LIVE)return;const a=S.access||{};if(a.ok||a.status!=="pending")return;
  try{const r=await api({action:"status"});if(r&&r.ok&&(r.status==="approved"||r.status==="denied")&&S.access.status==="pending"){S.access.status=r.status;save();renderGate()}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkStatus()});
function renderGate(){
  clearInterval(gatePoll);
  const g=$("#gate");const a=S.access||{};const st=gateStatus();
  if(st==="ok"){g.hidden=true;return}
  g.hidden=false;
  g.style.justifyContent=(st==="approved"||st==="denied")?"center":"";
  if(st==="new"){
    g.innerHTML=`${GICON()}<h1>No FOMO</h1><div class="sub">Club · Members only</div>
     <p>Der Club ist privat. Sag uns, wer du bist – wir schalten dich frei.</p>
     <label>Dein Name</label><input id="gName" autocomplete="given-name" autocapitalize="words" placeholder="z. B. Sophia" value="${esc(a.name||"")}" enterkeyhint="send">
     <div class="gerr" id="gErr"></div>
     <button class="gbtn" id="gReq">Zugang anfragen</button>
     <p class="gsmall">Keine Mail-App, kein Passwort. Du bekommst Bescheid, sobald du drin bist.</p>`;
    const go=()=>{const n=$("#gName").value.trim();if(n.length<2){$("#gErr").textContent="Bitte gib deinen Namen ein";return}
      $("#gReq").textContent="Wird gesendet …";$("#gReq").disabled=true;
      if(!LIVE){setTimeout(()=>{S.access={name:n,status:"pending",at:Date.now()};save();renderGate()},700);return}
      api({action:"request",name:n}).then(r=>{
        if(!r||!r.ok)throw 0;S.access={name:n,status:r.status==="approved"?"approved":"pending",at:Date.now()};save();renderGate()
      }).catch(()=>{$("#gReq").textContent="Zugang anfragen";$("#gReq").disabled=false;$("#gErr").textContent="Das hat nicht geklappt – prüf dein Internet und versuch es noch mal"})};
    $("#gReq").onclick=go;$("#gName").onkeydown=e=>{if(e.key==="Enter")go()};
  }else if(st==="pending"){
    const t=new Date(a.at||Date.now());
    g.innerHTML=`<div class="wait">${GICON("gi big")}<span class="ring"></span><span class="ring r2"></span></div>
     <h1 style="font-size:24px">Anfrage gesendet</h1><div class="sub">Hi ${esc(a.name)}</div>
     <p>Der Club prüft deine Anfrage. Lass die App einfach offen oder schau später wieder rein – sobald du freigeschaltet bist, geht's los.</p>
     <div class="steps">
       <div class="step done"><i>✓</i><div><b>Anfrage gesendet</b><span>${t.toLocaleDateString("de",{day:"numeric",month:"short"})}, ${t.toLocaleTimeString("de",{hour:"2-digit",minute:"2-digit"})} Uhr</span></div></div>
       <div class="step now"><i><em></em></i><div><b>Wartet auf Freigabe</b><span>Der Club hat eine Mail bekommen</span></div></div>
       <div class="step"><i>3</i><div><b>Willkommen im Club</b><span>Danach kannst du direkt losswipen</span></div></div>
     </div>
     <div class="gfoot"><button class="glink" id="gCancel">Anfrage zurückziehen</button>
       ${LIVE?"":`<button class="glink demo" id="gDemo">Vorschau: Antwort simulieren</button>`}</div>`;
    $("#gCancel").onclick=()=>{S.access={name:a.name};save();renderGate()};
    if(LIVE){checkStatus();gatePoll=setInterval(checkStatus,15000)}
    else $("#gDemo").onclick=()=>{const f=$("#gDemo").parentElement;f.innerHTML=`<p class="gsmall" style="margin-bottom:8px">So sieht es aus, wenn du in der Mail tippst auf …</p>
      <div class="row" style="gap:8px"><button class="gbtn" style="flex:1;margin:0" id="dOk">✅ Gewähren</button><button class="gbtn ghost" style="flex:1;margin:0" id="dNo">❌ Ablehnen</button></div>`;
      $("#dOk").onclick=()=>{S.access.status="approved";save();renderGate()};
      $("#dNo").onclick=()=>{S.access.status="denied";save();renderGate()}};
  }else if(st==="approved"){
    g.innerHTML=`<div class="yay"><div class="badge">✓</div></div>
     <h1 style="font-size:26px">Du bist drin</h1><div class="sub">Willkommen im Club, ${esc(a.name)}</div>
     <p>Ab jetzt heißt es: nie wieder nix vorhaben.</p>
     <button class="gbtn" id="gEnter">Club betreten 🥂</button>`;
    $("#gEnter").onclick=()=>{S.access.ok=true;save();g.style.transition="opacity .45s";g.style.opacity=0;setTimeout(()=>{g.hidden=true;g.style.opacity=""},450)};
  }else if(st==="denied"){
    g.innerHTML=`${GICON()}<h1 style="font-size:24px">Leider nicht</h1><div class="sub">Anfrage abgelehnt</div>
     <p>Deine Anfrage wurde diesmal nicht freigegeben. Wenn du glaubst, das war ein Versehen, frag einfach noch mal an.</p>
     <button class="gbtn" id="gAgain">Erneut anfragen</button>`;
    $("#gAgain").onclick=()=>{S.access={name:a.name};save();renderGate()};
  }
}
renderGate();

(function splash(){const s=$("#splash");const hide=()=>{s.classList.add("hide");setTimeout(()=>s.remove(),500)};
  setTimeout(hide,matchMedia("(prefers-reduced-motion: reduce)").matches?600:2900);s.addEventListener("click",hide)})();
$("#locName").textContent=S.center.name;
renderFilters();renderDays();renderHint();renderDeck();badge();
